<div class="album-r">
	<div class="info">
		<p class="title">{{include.title}}</p>
		<p class="band"><i>{{include.band}}, <time datetime="{{include.year}}">{{include.year}}</time></i></p>

		<blockquote class="resenha">
			{{include.review}}
		</blockquote>

		<p class="track"><b>Favorite track:</b> {{include.track}}</p>
		<p class="score"><b>Score:</b> {{include.score}}/10</p>
	</div>
	
	<img class="art" src="{{include.art}}"/>
	<p class="num">{{include.num}}</p>
	
</div>
